name: Workflow

on:
  push:
    branches:
      - 'main'
      - 'ci-*'
    tags:
      - 'v*'
  pull_request:

jobs:

  ci:
    strategy:
      matrix:
        platform:
          - { name: 'Linux',    arch: 'x64',        os: ubuntu-latest, werror: true, sdl-cmake-args: '-DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF' }
          # - { name: 'Linux',    arch: 'arm64',      os: ubuntu-latest, werror: true, cmake-toolchain-file: 'cmake/toolchains/linux-aarch64.cmake', apt-packages: 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu', cross: true }
          - { name: 'MacOS',    arch: 'arm64-x64',  os: macos-latest,  werror: true, cmake-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"', sdl-cmake-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF' }
          - { name: 'Windows',  arch: 'Win32',      os: windows-latest, sdl-cmake-args: '-DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF' }
          - { name: 'Windows',  arch: 'x64',        os: windows-latest, sdl-cmake-args: '-DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF' }

    env:
      SDL3_VERSION: 3.4.14
    defaults:
      run:
        shell: sh
    runs-on: '${{ matrix.platform.os }}'
    name: 'CI ${{ matrix.platform.name }} ${{ matrix.platform.arch }}'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ninja
        uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.arch }}
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev glslang-tools spirv-cross libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev ${{ matrix.platform.apt-packages }}
      - name: Install macOS dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install glslang spirv-cross
      - name: Install glslang (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-main-windows-x86_64-release.zip -OutFile glslang.zip
          Expand-Archive glslang.zip -DestinationPath glslang
          echo "$((Resolve-Path glslang/bin).Path)" >> $env:GITHUB_PATH
      - name: Build spirv-cross (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/SPIRV-Cross.git
          cmake -S SPIRV-Cross -B SPIRV-Cross/build -GNinja -DCMAKE_BUILD_TYPE=Release -DSPIRV_CROSS_SHARED=OFF -DSPIRV_CROSS_CLI=ON
          cmake --build SPIRV-Cross/build --target spirv-cross
          echo "$((Resolve-Path SPIRV-Cross/build).Path)" >> $env:GITHUB_PATH
      - name: Install dxc (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip -OutFile dxc.zip
          Expand-Archive dxc.zip -DestinationPath dxc
          echo "$((Resolve-Path dxc/bin/x64).Path)" >> $env:GITHUB_PATH
      - name: Set up SDL3
        uses: libsdl-org/setup-sdl@v1
        id: sdl
        with:
          version: ${{ env.SDL3_VERSION }}
          build-type: Release
          cmake-generator: Ninja
          cmake-arguments: ${{ matrix.platform.sdl-cmake-args }}
      - name: 'Configure (CMake)'
        id: configure
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.platform.cmake-toolchain-file }} \
            ${{ matrix.platform.cmake-args }}
      - name: 'Build (CMake)'
        run: |
          cmake --build build
