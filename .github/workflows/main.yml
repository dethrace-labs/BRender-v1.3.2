name: Workflow

on:
  push:
    branches:
      - 'main'
      - 'ci-*'
    tags:
      - 'v*'
  pull_request:

jobs:

  ci:
    strategy:
      matrix:
        platform:
          - { name: 'Linux',    arch: 'x64',        os: ubuntu-latest, werror: true }
          # - { name: 'Linux',    arch: 'arm64',      os: ubuntu-latest, werror: true, cmake-toolchain-file: 'cmake/toolchains/linux-aarch64.cmake', apt-packages: 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu', cross: true }
          - { name: 'MacOS',    arch: 'arm64-x64',  os: macos-latest,  werror: true, cmake-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"' }
          - { name: 'Windows',  arch: 'Win32',      os: windows-latest }
          - { name: 'Windows',  arch: 'x64',        os: windows-latest }

    env:
      SDL3_TAG: release-3.4.14
    defaults:
      run:
        shell: sh
    runs-on: '${{ matrix.platform.os }}'
    name: 'CI ${{ matrix.platform.name }} ${{ matrix.platform.arch }}'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ninja
        uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.arch }}
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev glslang-tools libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev ${{ matrix.platform.apt-packages }}
      - name: Install macOS dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install glslang
      - name: Install glslang (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-main-windows-x86_64-release.zip -OutFile glslang.zip
          Expand-Archive glslang.zip -DestinationPath glslang
          echo "$((Resolve-Path glslang/bin).Path)" >> $env:GITHUB_PATH
      - name: Build SDL3 from source
        shell: bash
        env:
          SDL3_PREFIX: ${{ runner.temp }}/sdl3-prefix
        run: |
          git clone --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git SDL3
          arch_args=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            arch_args+=(-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64")
          fi
          cmake -S SDL3 -B SDL3/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL3_PREFIX" \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            "${arch_args[@]}"
          cmake --build SDL3/build
          cmake --install SDL3/build
      - name: 'Configure (CMake)'
        id: configure
        env:
          SDL3_PREFIX: ${{ runner.temp }}/sdl3-prefix
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$SDL3_PREFIX" \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.platform.cmake-toolchain-file }} \
            ${{ matrix.platform.cmake-args }}
      - name: 'Build (CMake)'
        run: |
          cmake --build build
